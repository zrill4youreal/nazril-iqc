<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nazril - Iphone Quoted Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #000000, #222);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            color: #fff;
        }

        .light-effect {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,204,0,0.3) 0%, rgba(255,204,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: moveLight 15s infinite alternate ease-in-out;
            z-index: 0;
        }

        .light-effect:nth-child(1) {
            top: 10%;
            left: 10%;
            width: 200px;
            height: 200px;
            animation-delay: 0s;
        }

        .light-effect:nth-child(2) {
            bottom: 5%;
            right: 15%;
            width: 250px;
            height: 250px;
            animation-delay: 2s;
        }

        .light-effect:nth-child(3) {
            top: 50%;
            left: 5%;
            width: 150px;
            height: 150px;
            animation-delay: 4s;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 204, 0, 0.2);
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            position: relative;
            z-index: 1;
            transition: transform 0.3s ease;
            border: 1px solid #ffcc00;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ffcc00;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
            animation: pulse 2s infinite alternate;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            color: #ffcc00;
            margin-bottom: 10px;
            font-size: 24px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        .creator {
            color: #aaa;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ffcc00;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            background-color: #222;
            color: #ffcc00;
            border: 2px solid #ffcc00;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 0 3px rgba(255, 170, 0, 0.3);
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-row .input-group {
            flex: 1;
            margin-bottom: 0;
        }

        .button {
            background: linear-gradient(to right, #ffcc00, #ffaa00);
            color: #000;
            border: none;
            padding: 14px 25px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            margin: 10px 5px;
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.3);
        }

        .button:hover {
            background: linear-gradient(to right, #ffaa00, #ff8800);
            box-shadow: 0 6px 15px rgba(255, 204, 0, 0.5);
            transform: translateY(-2px);
        }

        .button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            display: none;
        }

        .result img {
            max-width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            border: 3px solid #ffcc00;
        }

        .download-btn {
            background: linear-gradient(to right, #ffcc00, #ffaa00);
            color: #000;
            display: none;
        }

        .download-btn:hover {
            background: linear-gradient(to right, #ffaa00, #ff8800);
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 204, 0, 0.7);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(255, 204, 0, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 204, 0, 0);
            }
        }

        @keyframes moveLight {
            0% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(50px, -30px) scale(1.1);
            }
            50% {
                transform: translate(-40px, 20px) scale(0.9);
            }
            75% {
                transform: translate(30px, 40px) scale(1.05);
            }
            100% {
                transform: translate(-50px, -20px) scale(1);
            }
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .loading-spinner {
            border: 5px solid #333;
            border-top: 5px solid #ffcc00;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 15px;
            }
            
       }     h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="light-effect"></div>
    <div class="light-effect"></div>
    <div class="light-effect"></div>

    <div class="container">
        <div class="logo">
            <img src="https://img1.pixhost.to/images/8163/633987017_media.jpg" alt="iPhone Quoted Generator Logo">
        </div>
        
        <h1>Welcome To iPhone Quoted Generator</h1>
        <p class="creator">Create By © Nazril</p>
        
        <div class="input-group">
            <label for="messageText">Masukkan kata-kata mu</label>
            <input type="text" id="messageText" placeholder="Tulis pesan Anda di sini...">
        </div>
        
        <div class="form-row">
            <div class="input-group">
                <label for="carrierName">Operator</label>
                <input type="text" id="carrierName" placeholder="Contoh: Telkomsel" value="Telkomsel">
            </div>
            
            <div class="input-group">
                <label for="batteryPercentage">Baterai (%)</label>
                <input type="number" id="batteryPercentage" min="0" max="100" value="87">
            </div>
        </div>
        
        <button id="generateBtn" class="button">Generate</button>
        
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Sedang membuat gambar...</p>
        </div>
        
        <div class="result">
            <img id="resultImage" src="" alt="Hasil iPhone Quoted">
            <a id="downloadBtn" href="#" class="button download-btn">Download Gambar</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const generateBtn = document.getElementById('generateBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const resultContainer = document.querySelector('.result');
            const loadingContainer = document.querySelector('.loading');
            const resultImage = document.getElementById('resultImage');
            
            generateBtn.addEventListener('click', function() {
                const message = document.getElementById('messageText').value.trim();
                const carrierName = document.getElementById('carrierName').value;
                const batteryPercentage = document.getElementById('batteryPercentage').value;
                
                if (!message) {
                    alert('Silakan masukkan pesan terlebih dahulu!');
                    return;
                }
                
                // Set nilai default untuk waktu dan sinyal
                const timeValue = "09:41";
                const signalStrength = 3;
                
                // Tampilkan loading
                loadingContainer.style.display = 'block';
                resultContainer.style.display = 'none';
                downloadBtn.style.display = 'none';
                
                // Bangun URL API
                const apiUrl = `https://brat.siputzx.my.id/iphone-quoted?time=${encodeURIComponent(timeValue)}&messageText=${encodeURIComponent(message)}&carrierName=${encodeURIComponent(carrierName)}&batteryPercentage=${batteryPercentage}&signalStrength=${signalStrength}&emojiStyle=apple`;
                
                // Set src gambar dan tunggu sampai load
                resultImage.onload = function() {
                    loadingContainer.style.display = 'none';
                    resultContainer.style.display = 'block';
                    downloadBtn.style.display = 'inline-block';
                    
                    // Set href untuk download
                    downloadBtn.href = resultImage.src;
                    downloadBtn.download = 'iphone-quoted.png';
                };
                
                resultImage.onerror = function() {
                    loadingContainer.style.display = 'none';
                    alert('Terjadi kesalahan saat menghasilkan gambar. Silakan coba lagi.');
                };
                
                resultImage.src = apiUrl;
            });
            
            // Fungsi untuk mengunduh gambar
            downloadBtn.addEventListener('click', function(e) {
                if (!resultImage.src) {
                    e.preventDefault();
                    alert('Tidak ada gambar untuk diunduh. Silakan buat gambar terlebih dahulu.');
                }
            });
        });
    </script>
</body>
</html>
